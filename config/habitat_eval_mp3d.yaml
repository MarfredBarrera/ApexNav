defaults:
  - /benchmark/nav/objectnav:
    - objectnav_mp3d
  - _self_

habitat_baselines:
  evaluate: True
  force_torch_single_threaded: True

habitat:
  dataset:
    split: val
    data_path: data/datasets/objectnav/mp3d/v1/{split}/{split}.json.gz
  environment:
    max_episode_steps: 500
    iterator_options:
      cycle: false
      shuffle: false
      max_scene_repeat_steps: 10000000
  task:
    lab_sensors:
      gps_sensor:
        type: GPSSensor
        dimensionality: 3
    measurements:
      success:
        success_distance: 0.2
  simulator:
    habitat_sim_v0:
      allow_sliding: false
    forward_step_size: 0.25
    turn_angle: 30
    agents:
      main_agent:
        radius: 0.18
        sim_sensors:
          depth_sensor:
            min_depth: 0.0
            max_depth: 5.0
            normalize_depth: true
          semantic_sensor:
            type: HabitatSimSemanticSensor
            height: 480
            width: 640
            position: [0.0, 0.88, 0.0]
            orientation: [0.0, 0.0, 0.0]
            hfov: 79
            sensor_subtype: PINHOLE

detector:
  yolo:
    confidence_threshold_yolo: 0.3
    iou_threshold_yolo: 0.5
    agnostic_nms: True

  groundingDINO:
    confidence_threshold_dino: 0.40
    text_threshold: 0.25

llm:
  llm_answer_path: llm/answers/llm_answer_mp3d.txt
  llm_response_path: llm/answers/llm_response_list.txt
  llm_client:
    llm_client: ollama # deepseek, ollama, or none
    ollama: 'qwen3:8b'

record_file_name: "record.txt"
continue_file_name: "continue.txt"

# Per-episode forensic recorder. Every episode appends one line to
# <video_output_path>/<summary_file>; the full pose/trajectory/RGB artifacts are
# written only for episodes whose result is listed in flush_on. Use "all" to
# capture every episode (~52 MB for a 500-step episode).
record:
  enabled: true
  flush_on: ["false positive", "last mile nav failure"]  # any RESULT_TYPES, or "all"
  capture_rgb: true
  capture_annotated_rgb: true
  capture_masks: true          # detector masks; cannot be regenerated by replay
  # Geometry is diagnostic only; semantic object IDs decide instance identity.
  ground_truth_match_distance_m: 1.0
  ground_truth_semantic_overlap: 0.5
  jpeg_quality: 85
  max_buffered_steps: 600
  summary_file: "episodes.jsonl"
# Perception gate (perception_gate/): before the planner may stop at a target
# cluster, its best stored view must pass 3DAwareVerification's
# perception.Verifier, served by `python -m perception.server` in that repo's
# container (docker network connect 3dawareverification_default apexnav).
# The planner also verifies at the stop itself (any target an accepted cluster
# does not cover, e.g. over-depth ones). perception_gate is imported only when
# enabled.
# Launch the planner with verification_gate:=true (VERIFICATION_GATE=true
# ./scripts/start_session.sh) when enabling it. Selector, ensemble filter and
# threshold are server flags, copied from /health into every decision line.
verification:
  enabled: false
  url: http://3dawareverification-dev-1:8770
  timeout_s: 120
  on_error: accept              # server error/timeout: accept (fail open) or reject
  on_no_evidence: accept        # no stored view of the cluster: accept, reject, or defer (go on, re-verify at the stop)
  on_view_reject: reject        # raw frame accepts, SAM3D view says no: reject, or defer (approach, re-verify at the stop)
  max_consecutive_errors: 3     # then abort the run: never run silently ungated
  ping_timeout_s: 60            # startup /health; tolerates one in-flight verification
  max_checks: 3                 # per cluster, including re-checks
  recheck_cooldown_steps: 25    # a rejected cluster may be re-checked after this many steps
  recheck_min_distance_m: 1.0   # ... from a camera this far from every view used before
  recheck_min_angle_deg: 45     # ... or looking at it from this different a direction
  match_distance_m: 0.75        # evidence detection to cluster centroid
  # Approach (server --selector d1, planner verification_approach:=true, on_error: reject):
  # an insufficient view makes the cluster the planner's target until a new view decides
  approach: false
  approach_max_per_cluster: 2   # approaches per cluster; failure or insufficient on arrival rejects
  approach_max_steps: 40        # actions per approach
  approach_episode_steps: 120   # approach actions per episode
  approach_min_closer_m: 0.5    # a view on the way is new when this much closer than every judged view ...
  approach_min_angle_deg: 30    # ... or this far around the object from each
  log_dir: "{video_output_path}/verification"
  save_images: true
need_video: false
video_output_path: "videos/test_mp3d_{split}"
test_epi_num: -1
# Deterministic simulator-planner step (launch the planner with sync_step:=true too):
# one StepObservation per executed step, no republishing while waiting
sync_step: false
sync_stall_timeout_s: 600     # sync_step: abort when the planner sends no action this long

# Video rendering
# "apexnav" draws the planner's own top-down view (value map, occupancy grid,
# frontier/object clusters, TSP tour, planned path, trajectory, agent pose)
# with the annotated RGB observation inset; "habitat" keeps the stock layout.
video_style: apexnav
video_fps: 6
visualization:
  frame_size: [1280, 720]
  map_size: [80.0, 80.0]      # must match map_size_x/y passed to the planner
  map_resolution: 0.05        # must match sdf_map.resolution
  inset_width_frac: 0.28
  max_px_per_cell: 8.0
  map_extent_m: 24.0        # fixed map window in metres (0 = fit explored area)
  map_follow_margin: 0.25   # window slides only inside this edge margin
  agent_size_m: 0.45        # agent triangle length in metres
  value_cmap: turbo         # turbo/jet/inferno/magma/plasma/viridis/hot
  value_floor: 0.02         # hide value cells below this
  value_norm: auto          # auto = ramp tops out at the max value seen
  value_vmax: 1.0           # ramp maximum when value_norm is not auto
  value_vmax_floor: 0.05    # lowest auto maximum, avoids amplifying noise
  camera_hfov_deg: 79.0
  camera_range_m: 5.0
  show_value_map: true
  show_inflation: true
  show_frontiers: true
  show_objects: true
  show_tsp_tour: true
  show_planned_path: true
  show_trail: true
  show_fov: true
  show_rgb_inset: true
  show_legend: true
  show_gt_map: false          # habitat ground-truth top-down map as 2nd inset
